<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} - قايمة مهامي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">قايمة مهامي</a>
            <div class="navbar-nav">
                {% if session.user_id %}
                <a class="nav-link" href="/logout">تسجيل خروج</a>
                {% else %}
                <a class="nav-link" href="/login">تسجيل دخول</a>
                <a class="nav-link" href="/register">إنشاء حساب</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-warning">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block main %}{% endblock %}
    </div>
</body>
</html>
